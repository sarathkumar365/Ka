data_repo: ~/ka-data  # scripts/setup.sh creates it here
flags:
  nightly_extraction: false
  web_ui: false
  intake: false
  category_suggestions: false
  private_routing: false
  google: false
  tracing: false
  web_search: false
  movies: false
  loops: false
ui_hosts: []  # extra Host names the UI accepts, e.g. a tailscale hostname
models:
  # Each task uses the cheapest model that passes its evals. Chat: Haiku on OpenRouter with zero
  # data retention (check the exact slug at https://openrouter.ai/api/v1/models). cache: true marks
  # the system prompt for prompt caching; fallbacks are tried in order when a model is down.
  default: {provider: openrouter, model: "set-me", zdr: true, cache: true, fallbacks: []}
  small: {provider: openrouter, model: "set-me", zdr: true}  # nightly extraction, sorting
  grader: {provider: openrouter, model: "set-me"}  # eval judge (Opus)
private_models:  # finance conversations, tried in order; an Ollama entry can go first later
  - {provider: openrouter, model: "set-me", zdr: true, only: [amazon-bedrock]}  # key from OPENROUTER_API_KEY
# US dollars per million tokens, for providers that report no cost (OpenAI, Ollama). The loop cost
# cap uses it; a model not listed counts at the dearest price here. Leave empty to skip estimates.
# prices:
#   set-me: {input_per_m: 0.15, output_per_m: 0.60}
google:  # Drive statement inbox and Sheet copy; each account sets its folder and Sheet in Settings
  client_file: set-me  # path to the OAuth desktop client JSON, kept outside the repo
