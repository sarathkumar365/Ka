[project]
name = "ka-agent"
version = "0.1.0"
description = "Ka: personal data layer and agent"
requires-python = ">=3.13"
dependencies = [
    "openai>=3.52.0",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.3",
    "ruamel-yaml>=0.19.1",
]

[project.scripts]
ka = "server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: runs real models, costs money (KA_LIVE_EVALS=1)"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.5",
]

[tool.ruff.lint]
ignore = ["RUF012"]
